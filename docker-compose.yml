# Явное имя проекта: иначе при сборке из этой папки Docker берёт имя каталога
# (robbo_personal_account_backend) и тег образа app становится другим, чем у уже
# запущенного стека с docker compose -p rpa2 (образ rpa2-app) — новый код не попадает в контейнер.
name: rpa2

services:
  app:
    restart: unless-stopped
    # Above app.StopTimeout (28s): in-flight requests drain before SIGKILL.
    stop_grace_period: 30s
    build:
      context: .
      network: host
    environment:
      - DEBUG=false
      - LEGACY_POSTGRES_ENABLED=false
      - AUTH_MODE=oidc_bff
      - AUTH_LMS_PASSWORD_FALLBACK=${AUTH_LMS_PASSWORD_FALLBACK:-false}
      - LK_SSO_WITH_LMS_ENABLED=true
      - PROJECTS_POSTGRES_DSN=host=host.docker.internal port=5433 user=robbo_projects password=robbo_projects_change_me dbname=robbo_projects sslmode=disable
      - LICENSING_POSTGRES_DSN=host=host.docker.internal port=5434 user=robbo_licensing password=robbo_licensing_change_me dbname=robbo_licensing sslmode=disable
      - LICENSING_PRIVATE_KEY_PATH=/app/keys/licensing/dev-private.pem
      - LICENSING_ADDON_STATIC_DIR=/app/keys/licensing/addon
      - LMS_MYSQL_DSN=${LMS_MYSQL_DSN:-lk_readonly:lk_readonly_change_me@tcp(host.docker.internal:3307)/openedx}
      - LMS_MYSQL_WRITE_DSN=${LMS_MYSQL_WRITE_DSN:-lk_write:lk_write_change_me@tcp(host.docker.internal:3307)/openedx}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://host.docker.internal:9200}
      - ELASTICSEARCH_ENABLED=${ELASTICSEARCH_ENABLED:-true}
      # Defaults = mock :8081. Tutor: copy backend/.env.tutor.example into .env
      - OIDC_ISSUER=${OIDC_ISSUER:-http://localhost:8081/default}
      - OIDC_AUTHORIZATION_ENDPOINT=${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:8081/default/authorize}
      - OIDC_TOKEN_ENDPOINT=${OIDC_TOKEN_ENDPOINT:-http://host.docker.internal:8081/default/token}
      - OIDC_JWKS_URI=${OIDC_JWKS_URI:-http://host.docker.internal:8081/default/jwks}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-lk-web}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:8080/auth/oidc/callback}
      - OIDC_LOGOUT_ENDPOINT=${OIDC_LOGOUT_ENDPOINT:-http://localhost:8081/default/endsession}
      - OIDC_POST_LOGOUT_REDIRECT_URI=${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3030/}
      - OIDC_FRONTEND_BASE_URL=${OIDC_FRONTEND_BASE_URL:-http://localhost:3030}
      - LMS_URL=${LMS_URL:-}
      - LMS_PUBLIC_URL=${LMS_PUBLIC_URL:-http://local.openedx.io}
      - ROBBO_RS_URL=${ROBBO_RS_URL:-http://localhost:8601/}
      - OIDC_RETURN_TO_ORIGINS=${OIDC_RETURN_TO_ORIGINS:-}
      # Local mock IdP (:8081) omits aud; never enable for a real IdP.
      - OIDC_ALLOW_MOCK_AUDIENCE=${OIDC_ALLOW_MOCK_AUDIENCE:-true}
      # GraphQL playground (GET /) and introspection: local dev only, off by default in code.
      - GRAPHQL_PLAYGROUND=${GRAPHQL_PLAYGROUND:-true}
      - GRAPHQL_INTROSPECTION=${GRAPHQL_INTROSPECTION:-true}
      - AUTH_ACCESS_SIGNING_KEY=${AUTH_ACCESS_SIGNING_KEY}
      - AUTH_REFRESH_SIGNING_KEY=${AUTH_REFRESH_SIGNING_KEY}
      - AUTH_REFRESH_COOKIE_SECURE=${AUTH_REFRESH_COOKIE_SECURE:-false}
      - AUTH_REFRESH_COOKIE_SAMESITE=${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      - CORS_ALLOW_PRIVATE_NETWORK=${CORS_ALLOW_PRIVATE_NETWORK:-true}
      - PORTAL_OUTBOX_ENABLED=false
      - API_TOKEN=${API_TOKEN:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
      # Server-to-server Open edX base for every api_urls.* call (cohorts, enrollments, courses).
      # Empty keeps the URLs from config.yml.
      - EDX_API_BASE_URL=${EDX_API_BASE_URL:-}
      # Open edX notifications in the LK bell (LMS service API as lk-service); base defaults to EDX_API_BASE_URL.
      - LMS_NOTIFICATIONS_ENABLED=${LMS_NOTIFICATIONS_ENABLED:-false}
      - LMS_NOTIFICATIONS_BASE_URL=${LMS_NOTIFICATIONS_BASE_URL:-}
      - LMS_NOTIFICATIONS_CLIENT_ID=${LMS_NOTIFICATIONS_CLIENT_ID:-lk-service}
      - LMS_NOTIFICATIONS_CLIENT_SECRET=${LMS_NOTIFICATIONS_CLIENT_SECRET:-}
      # YooKassa (optional; from backend/.env — never commit secrets)
      - PAYMENTS_YOOKASSA_SHOP_ID=${PAYMENTS_YOOKASSA_SHOP_ID:-}
      - PAYMENTS_YOOKASSA_SECRET_KEY=${PAYMENTS_YOOKASSA_SECRET_KEY:-}
      # "Мои файлы" (off until the frontend opens it); the bytes go to the lk_userfiles volume.
      - USERFILES_ENABLED=${USERFILES_ENABLED:-false}
      # ClamAV for "Мои файлы" (service clamd, profile antivirus). Empty address: no scan.
      # Required: an upload without a scan is refused; file assignments in classes need it.
      - USERFILES_ANTIVIRUS_ADDRESS=${USERFILES_ANTIVIRUS_ADDRESS:-}
      - USERFILES_ANTIVIRUS_REQUIRED=${USERFILES_ANTIVIRUS_REQUIRED:-false}
      - CLASSES_MAXSUBMISSIONFILES=${CLASSES_MAXSUBMISSIONFILES:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Local RSA keys + addon (placeholder or paid-addon.local.js from sync_paid_addon.sh)
      - ./keys/licensing:/app/keys/licensing:ro
      # User files; a new volume takes the image's owner (uid 1000) of this directory.
      - userfiles:/app/data/userfiles
    ports:
      - 8080:8080
    networks:
      - lk

  # ClamAV daemon for "Мои файлы": the app streams each upload to clamd:3310 (INSTREAM).
  # Off in dev unless asked for: docker compose --profile antivirus up -d clamd, then
  # USERFILES_ANTIVIRUS_ADDRESS=clamd:3310. It needs about 1.5 GB of RAM; the first start
  # loads the signatures for a minute or two (the image's own healthcheck waits for it).
  clamd:
    image: clamav/clamav:1.5.4
    profiles: [antivirus]
    # Past a limit clamd stops looking and answers OK unless AlertExceedsMax is on: padding
    # entries in a zip hid a virus from it. The limits sit above what zipcheck.go lets through
    # (20000 entries, 1 GB unpacked). In the entrypoint because a release ships compose files only.
    entrypoint:
      - /bin/sh
      - -c
      - |
        grep -q '^AlertExceedsMax' /etc/clamav/clamd.conf || cat >> /etc/clamav/clamd.conf <<'EOF'
        AlertExceedsMax yes
        MaxFiles 25000
        MaxScanSize 1200M
        MaxFileSize 1200M
        EOF
        exec /init
    restart: unless-stopped
    mem_limit: ${CLAMD_MEM_LIMIT:-3g}
    volumes:
      # Signatures freshclam keeps updating; kept across restarts and image updates.
      - clamav:/var/lib/clamav
    networks:
      - lk

volumes:
  userfiles:
    # Fixed name: deploy/lk-remote.sh backs it up by this name.
    name: lk_userfiles
  clamav:
    name: lk_clamav

networks:
  lk:
    driver: bridge
